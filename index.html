
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <h1>Interactive To-Do List</h1>
    
    <!-- Task Form -->
    <form id="todo-form">
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
        <button type="submit">Add Task</button>
      </div>
      <p id="error-message" class="error-text" hidden></p>
    </form>

    <div class="todo-meta">
      <div class="counters">
        Total: <span id="total-count">0</span> | Remaining: <span id="remaining-count">0</span>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul id="todo-list"></ul>

    <div class="actions">
      <button id="clear-completed-btn">Clear Completed</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
